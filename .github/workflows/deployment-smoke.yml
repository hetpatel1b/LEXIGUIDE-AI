name: Deployment Smoke Verification

on:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: "Target Deployment URL to verify (e.g., https://lexiguide-ai.vercel.app)"
        required: true
        default: "http://localhost:3000"

permissions:
  contents: read

jobs:
  smoke-check:
    name: Verify Deployed Routes & Health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: "npm"

      - name: Run Deployment Smoke Check
        env:
          TARGET_URL: ${{ github.event.inputs.deployment_url }}
        run: node scripts/deployment-smoke-check.mjs "$TARGET_URL"
